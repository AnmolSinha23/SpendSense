{% extends "base.html" %}

{% block title %}Create Account - SpendSense{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-6 col-lg-5">
        <div class="card card-custom p-4 shadow-lg border-0">
            <div class="text-center mb-4">
                <div class="d-inline-flex p-3 rounded-circle bg-success bg-opacity-10 text-success mb-3">
                    <i class="bi bi-person-plus-fill fs-2"></i>
                </div>
                <h4 class="fw-bold mb-1">Create SpendSense Account</h4>
                <p class="text-muted small">Start organizing your personal finances and budgets</p>
            </div>

            <form action="{{ url_for('auth.register') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                        <input type="text" class="form-control border-start-0 ps-0" name="name" placeholder="John Doe" value="{{ name if name else '' }}" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                        <input type="email" class="form-control border-start-0 ps-0" name="email" placeholder="john@example.com" value="{{ email if email else '' }}" required>
                    </div>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-secondary">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" name="password" placeholder="Min. 6 chars" required minlength="6">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-secondary">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock-fill text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" name="confirm_password" placeholder="Repeat password" required minlength="6">
                        </div>
                    </div>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary py-2 fw-semibold rounded-3 shadow-sm">
                        Register Account <i class="bi bi-check-circle ms-1"></i>
                    </button>
                </div>
            </form>

            <div class="text-center">
                <span class="small text-muted">Already registered? </span>
                <a href="{{ url_for('auth.login') }}" class="small fw-semibold text-decoration-none">Sign In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
